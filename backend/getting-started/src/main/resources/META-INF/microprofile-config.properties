# OllamaChatModel - connects to Ollama server
dev.langchain4j.cdi.plugin.chat-model.class=dev.langchain4j.model.ollama.OllamaChatModel
dev.langchain4j.cdi.plugin.chat-model.config.base-url=http://localhost:11434
dev.langchain4j.cdi.plugin.chat-model.config.model-name=gemma3:4b
dev.langchain4j.cdi.plugin.chat-model.config.temperature=0.2
dev.langchain4j.cdi.plugin.chat-model.config.topP=0.9
dev.langchain4j.cdi.plugin.chat-model.config.log-requests=true
dev.langchain4j.cdi.plugin.chat-model.config.log-responses=true
dev.langchain4j.cdi.plugin.chat-model.config.timeout=PT5M
dev.langchain4j.cdi.plugin.chat-model.config.supported-capabilities=RESPONSE_FORMAT_JSON_SCHEMA

# MessageWindowChatMemory - keeps last N messages
dev.langchain4j.cdi.plugin.chat-memory.class=dev.langchain4j.memory.chat.MessageWindowChatMemory
dev.langchain4j.cdi.plugin.chat-memory.scope=jakarta.enterprise.context.ApplicationScoped
dev.langchain4j.cdi.plugin.chat-memory.config.maxMessages=10

artifact.dir=${jboss.server.data.dir}/artifacts